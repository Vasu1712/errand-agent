name: happy_path_plumber
title: Happy-path plumber booking (the spec's first example)
covers: [booking, memory, approval, verification]
world: book_succeeds
user: u_demo
seed_demo: true  # saved area Koramangala and earliest time 09:00, among 60+ facts
model:
  slot_patch:
    - {service: plumber, when: this_week, time_window: morning, budget_max_inr: 1500, problem: kitchen tap}
decider:
  intent: [book]
  approval: ["yes"]
steps:
  - say: "Find a plumber for my kitchen tap this week, mornings only, under ₹1,500."
  - say: "1"
  - confirm: "Yes, go ahead."
expect:
  - check: booked
    service: plumber
    area: Koramangala
    days: ["2026-11-03", "2026-11-08"]
    min_hour: 9  # the saved earliest time
    max_hour: 12  # mornings only
    max_price: 1500
  - check: asked
    none: true
  - check: phases
    phases: [presenting, awaiting_approval, done]
  - check: sequence
    step: 3
    tools: [hold_slot, book, get_booking_status]
  - check: ledger
    op: book
    statuses: [confirmed]
    attempts: [1]
  - check: approvals
    consumed: 1
  - check: claims
    book: 1
