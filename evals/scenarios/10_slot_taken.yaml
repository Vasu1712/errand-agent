name: slot_taken
title: The slot is taken at book(); the other options come back and need a fresh yes
covers: [slot_conflict, approval]
world: slot_taken
user: u_st
model:
  slot_patch:
    - {service: plumber, area: Koramangala, when: this_week, time_window: morning, budget_max_inr: 1500}
decider:
  intent: [book]
  approval: ["yes", "yes"]
steps:
  - say: "Find a plumber in Koramangala this week, mornings only, under ₹1,500."
  - say: "1"
  - confirm: "Yes, go ahead."
  - say: "1"
  - confirm: "Yes, go ahead."
expect:
  - check: phases
    phases: [presenting, awaiting_approval, presenting, awaiting_approval, done]
  - check: ledger
    op: book
    statuses: [not_booked, confirmed]
  - check: approvals
    consumed: 2
    distinct: true
  - check: booked
    service: plumber
  - check: claims
    book: 1
