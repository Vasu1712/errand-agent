name: hold_lapses_same_price
title: The yes comes after the 10-minute hold expired; the same price re-holds and reuses that approval
covers: [approval, hold_expiry]
world: book_succeeds
world_overrides: {quote_delta_inr: {"*": 100}}
user: u_lapse1
model:
  slot_patch:
    - {service: plumber, area: Koramangala, when: this_week, time_window: morning, no_budget_limit: true}
decider:
  intent: [book]
  approval: ["yes", "yes"]
steps:
  - say: "Find a plumber in Koramangala this week, mornings only, no budget limit."
  - say: "1"
  - confirm: "Yes, go ahead."  # the hold quotes ₹800: asked again, with the slot held
  - advance: 660  # the hold lapses before the answer
  - confirm: "Yes, go ahead."
expect:
  - check: approval_trail  # no third approval: the re-hold quoted what was approved
    trail: [{status: invalidated, price: 700}, {status: consumed, price: 800}]
  - check: sequence
    step: 5
    tools: [hold_slot, book, get_booking_status]
  - check: calls
    tool: hold_slot
    count: 2
  - check: booked
    price: 800
