name: hold_lapses_new_price
title: The hold expired before the yes and the re-hold quotes a new price; asked again, booked at that price
covers: [approval, hold_expiry, price_change]
world: book_succeeds
world_overrides: {quote_delta_inr: {"*": 100}, rehold_delta_inr: 50}
user: u_lapse2
model:
  slot_patch:
    - {service: plumber, area: Koramangala, when: this_week, time_window: morning, no_budget_limit: true}
decider:
  intent: [book]
  approval: ["yes", "yes", "yes"]
steps:
  - say: "Find a plumber in Koramangala this week, mornings only, no budget limit."
  - say: "1"
  - confirm: "Yes, go ahead."  # ₹700 approved; the hold quotes ₹800
  - advance: 660
  - confirm: "Yes, go ahead."  # ₹800 approved; the re-hold quotes ₹850
  - confirm: "Yes, go ahead."  # ₹850 approved
expect:
  - check: approval_trail
    trail:
      - {status: invalidated, price: 700}
      - {status: invalidated, price: 800}
      - {status: consumed, price: 850}
  - check: sequence
    step: 5
    tools: [hold_slot]
  - check: booked
    price: 850
  - check: phases
    phases: [presenting, awaiting_approval, awaiting_approval, awaiting_approval, done]
