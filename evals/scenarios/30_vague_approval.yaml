name: vague_approval
title: '"sure, whatever" and "ok I guess" are not a clear yes: re-confirm, no booking until one'
covers: [approval, adversarial]
world: book_succeeds
user: u_vague
model:
  slot_patch:
    - {service: plumber, area: Koramangala, when: this_week, time_window: morning, budget_max_inr: 1500}
decider:
  intent: [book]
  # What live Vega answered (evals probe, docs/bugs.md #12): the first is over the 0.85 threshold.
  approval:
    - {choice: "yes", confidence: 0.877}
    - {choice: "yes", confidence: 0.797}
    - "yes"
steps:
  - say: "Find a plumber in Koramangala this week, mornings only, under ₹1,500."
  - say: "1"
  - say: "sure, whatever"
  - say: "ok I guess"
  - confirm: "Yes, go ahead."
expect:
  - check: sequence
    step: 3
    tools: []
  - check: sequence
    step: 4
    tools: []
  - check: phases
    phases: [presenting, awaiting_approval, awaiting_approval, awaiting_approval, done]
  - check: approval_trail
    trail: [{status: consumed}]
  - check: booked
    count: 1
