name: restart_after_book_was_sent
title: The process dies after book() went through; the reconciler finds it, still exactly one booking
covers: [restart, idempotency]
world: book_succeeds
world_overrides: {book_forced: [crash_after_commit, success]}
user: u_crash2
model:
  slot_patch:
    - {service: plumber, area: Koramangala, when: this_week, time_window: morning, budget_max_inr: 1500}
  smalltalk:
    - {text: "Happy to help."}
decider:
  intent: [book, smalltalk]
  approval: ["yes"]
steps:
  - say: "Find a plumber in Koramangala this week, mornings only, under ₹1,500."
  - say: "1"
  - confirm: "Yes, go ahead."
    expect_crash: true
  - restart: true
  - say: "Did it go through?"
expect:
  - check: booked
    count: 1
  - check: calls
    tool: book
    count: 1
  - check: ledger
    op: book
    statuses: [confirmed]
    attempts: [1]
  - check: outbox
    kind: reconciled
    count: 1
  - check: claims
    book: 1
