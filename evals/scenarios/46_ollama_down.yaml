name: ollama_down
title: Ollama is down for a turn; a clear message and no side effects, then it works again
covers: [tool_failure, model_failure]
world: book_succeeds
user: u_no_llm
model:
  slot_patch:
    - {error: unavailable}
    - {service: plumber, area: Koramangala, when: this_week, time_window: morning, budget_max_inr: 1500}
decider:
  intent: [book, book]
steps:
  - say: "Find a plumber in Koramangala this week, mornings only, under ₹1,500."
  - say: "Find a plumber in Koramangala this week, mornings only, under ₹1,500."
expect:
  - check: stops
    model: 1
  - check: phases
    phases: [idle, presenting]
    outcomes: [stopped, ok]
  - check: quiet
